<!-- Interactive Timer Simulation -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
      let seconds = 42;
      const countdownElem = document.getElementById("countdown");
      
      const interval = setInterval(() => {
        if (seconds > 0) {
          seconds--;
          const secStr = seconds < 10 ? `0${seconds}` : `${seconds}`;
          if (countdownElem) {
            countdownElem.textContent = `00:${secStr}s`;
          }
        } else {
          clearInterval(interval);
          if (countdownElem) {
            countdownElem.parentElement.innerHTML = `<button type="button" class="text-primary font-bold hover:underline">Resend Now</button>`;
          }
        }
      }, 1000);
    });
  </script>
